<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Fitting Playground</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

#sidebar { width: 340px; background: #16213e; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; border-right: 2px solid #0f3460; }
#sidebar h2 { font-size: 14px; color: #8899aa; text-transform: uppercase; letter-spacing: 1px; }
#shape-table { width: 100%; border-collapse: collapse; font-size: 12px; }
#shape-table th { color: #8899aa; text-align: left; padding: 4px 6px; cursor: pointer; user-select: none; border-bottom: 1px solid #333; white-space: nowrap; }
#shape-table th:hover { color: #e94560; }
#shape-table th.sorted { color: #e94560; }
#shape-table td { padding: 4px 6px; vertical-align: middle; }
#shape-table tr.shape-row { cursor: pointer; transition: background 0.1s; }
#shape-table tr.shape-row:hover { background: #1a1a2e; }
#shape-table tr.shape-row.selected { background: #0f3460; }
#shape-table tr.shape-row.placed { opacity: 0.3; pointer-events: none; }
.col-pts { color: #e94560; font-weight: bold; text-align: right; }
.col-area { color: #aaa; text-align: right; }
.col-ratio { color: #4cc9f0; text-align: right; }

#main { flex: 1; display: flex; flex-direction: column; }
#topbar { padding: 12px 20px; display: flex; align-items: center; gap: 20px; background: #16213e; border-bottom: 2px solid #0f3460; }
#topbar button { background: #0f3460; color: #e0e0e0; border: 1px solid #333; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
#topbar button:hover { background: #e94560; }
#score-display { font-size: 18px; font-weight: bold; }
#score-display span { color: #e94560; }
#problem-info { color: #888; font-size: 13px; }
#controls-help { color: #666; font-size: 11px; margin-left: auto; }

#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
#gameCanvas { background: #0f0f23; border-radius: 8px; cursor: crosshair; }

#overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
#overlay.active { display: flex; }
#overlay-content { background: #16213e; padding: 30px; border-radius: 12px; text-align: center; border: 2px solid #e94560; }
#overlay-content h2 { color: #e94560; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Shapes</h2>
  <table id="shape-table">
    <thead><tr>
      <th data-sort="name">Shape</th>
      <th data-sort="score">Pts</th>
      <th data-sort="area">Area</th>
      <th data-sort="ratio">Pts/A</th>
    </tr></thead>
    <tbody id="shape-tbody"></tbody>
  </table>
</div>

<div id="main">
  <div id="topbar">
    <button onclick="prevProblem()">&larr; Prev</button>
    <span id="problem-info">Problem 1</span>
    <button onclick="nextProblem()">Next &rarr;</button>
    <button onclick="resetProblem()">Reset</button>
    <button onclick="removeLast()">Undo</button>
    <div id="score-display">Score: <span id="score-val">0</span></div>
    <div id="controls-help">Click shape &rarr; click to place | Drag to move | Right-click = remove</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
</div>

<div id="overlay"><div id="overlay-content"></div></div>

<script>
// ===== Seeded RNG =====
class RNG {
  constructor(seed) { this.s = seed | 0; }
  next() { this.s = (this.s * 1103515245 + 12345) & 0x7fffffff; return this.s / 0x7fffffff; }
  randInt(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  randFloat(a, b) { return a + this.next() * (b - a); }
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = this.randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
}

// ===== Polygon math =====
function polygonArea(verts) {
  let a = 0;
  for (let i = 0; i < verts.length; i++) {
    const j = (i + 1) % verts.length;
    a += verts[i][0] * verts[j][1] - verts[j][0] * verts[i][1];
  }
  return Math.abs(a) / 2;
}

function polygonCentroid(verts) {
  let cx = 0, cy = 0;
  for (const [x, y] of verts) { cx += x; cy += y; }
  return [cx / verts.length, cy / verts.length];
}

function rotateVerts(verts, angle, cx, cy) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return verts.map(([x, y]) => {
    const dx = x - cx, dy = y - cy;
    return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  });
}

function translateVerts(verts, dx, dy) {
  return verts.map(([x, y]) => [x + dx, y + dy]);
}

// Point in polygon (ray casting)
function pointInPolygon(px, py, verts) {
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const xi = verts[i][0], yi = verts[i][1], xj = verts[j][0], yj = verts[j][1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// Line segment intersection
function segmentsIntersect(a1, a2, b1, b2) {
  const d1 = cross(b1, b2, a1), d2 = cross(b1, b2, a2);
  const d3 = cross(a1, a2, b1), d4 = cross(a1, a2, b2);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
      ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
  if (d1 === 0 && onSegment(b1, b2, a1)) return true;
  if (d2 === 0 && onSegment(b1, b2, a2)) return true;
  if (d3 === 0 && onSegment(a1, a2, b1)) return true;
  if (d4 === 0 && onSegment(a1, a2, b2)) return true;
  return false;
}

function cross(o, a, b) {
  return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
}

function onSegment(p, q, r) {
  return r[0] <= Math.max(p[0], q[0]) && r[0] >= Math.min(p[0], q[0]) &&
         r[1] <= Math.max(p[1], q[1]) && r[1] >= Math.min(p[1], q[1]);
}

// Do two polygons overlap?
function polygonsOverlap(a, b) {
  // Check edge intersections
  for (let i = 0; i < a.length; i++) {
    const a1 = a[i], a2 = a[(i + 1) % a.length];
    for (let j = 0; j < b.length; j++) {
      if (segmentsIntersect(a1, a2, b[j], b[(j + 1) % b.length])) return true;
    }
  }
  // Check containment
  if (pointInPolygon(a[0][0], a[0][1], b)) return true;
  if (pointInPolygon(b[0][0], b[0][1], a)) return true;
  return false;
}

// Is polygon fully inside box?
function polyInBox(verts, bw, bh) {
  return verts.every(([x, y]) => x >= 0 && x <= bw && y >= 0 && y <= bh);
}

// ===== Shape templates =====
function makeShapeTemplates(rng) {
  const templates = [
    { name: "L-shape", v: [[0,0],[30,0],[30,15],[15,15],[15,45],[0,45]] },
    { name: "T-shape", v: [[0,0],[45,0],[45,15],[30,15],[30,40],[15,40],[15,15],[0,15]] },
    { name: "S-shape", v: [[15,0],[45,0],[45,15],[30,15],[30,30],[15,30],[15,45],[0,45],[0,30],[15,30],[15,15],[0,15],[0,0],[15,0]] },
    { name: "Plus", v: [[15,0],[30,0],[30,15],[45,15],[45,30],[30,30],[30,45],[15,45],[15,30],[0,30],[0,15],[15,15]] },
    { name: "Triangle", v: [[0,35],[20,0],[40,35]] },
    { name: "Diamond", v: [[20,0],[40,20],[20,40],[0,20]] },
    { name: "Trapezoid", v: [[10,0],[35,0],[45,25],[0,25]] },
    { name: "Pentagon", v: [[20,0],[40,14],[33,38],[7,38],[0,14]] },
    { name: "Arrow", v: [[0,12],[25,12],[25,0],[45,18],[25,36],[25,24],[0,24]] },
    { name: "Rect-wide", v: [[0,0],[50,0],[50,18],[0,18]] },
    { name: "Rect-tall", v: [[0,0],[18,0],[18,50],[0,50]] },
    { name: "Rect-sm", v: [[0,0],[22,0],[22,22],[0,22]] },
    { name: "Hexagon", v: [[10,0],[30,0],[40,17],[30,34],[10,34],[0,17]] },
    { name: "Parallelogram", v: [[12,0],[48,0],[36,24],[0,24]] },
    { name: "Chevron", v: [[0,0],[15,0],[30,20],[15,40],[0,40],[15,20]] },
    { name: "Wedge", v: [[0,30],[45,0],[45,30]] },
    { name: "Hook", v: [[0,0],[15,0],[15,30],[35,30],[35,45],[0,45]] },
    { name: "Zigzag", v: [[0,0],[15,0],[15,15],[30,15],[30,30],[15,30],[15,15],[0,15]] },
  ];

  // Fix S-shape and Zigzag to be proper simple polygons
  templates[2] = { name: "S-shape", v: [[15,0],[30,0],[30,15],[45,15],[45,30],[30,30],[30,45],[15,45],[15,30],[0,30],[0,15],[15,15]] };
  templates[17] = { name: "Zigzag", v: [[0,0],[15,0],[15,12],[30,12],[30,0],[45,0],[45,15],[30,15],[30,27],[15,27],[15,15],[0,15]] };

  return templates;
}

// ===== Problem generation =====
function generateProblem(seed, nShapes, boxW, boxH) {
  const rng = new RNG(seed);
  const templates = makeShapeTemplates(rng);
  rng.shuffle(templates);

  const shapes = [];
  const colors = [
    '#e94560','#0f3460','#00b4d8','#e9c46a','#2a9d8f',
    '#f4845f','#7209b7','#4cc9f0','#80b918','#ff6b6b',
    '#48bfe3','#f77f00','#d62828','#6a4c93','#1d3557',
    '#a7c957','#bc6c25','#e63946',
  ];

  const n = Math.min(nShapes, templates.length);
  for (let i = 0; i < n; i++) {
    const t = templates[i];
    // Random scale
    const scale = rng.randFloat(0.7, 1.4);
    let verts = t.v.map(([x, y]) => [x * scale, y * scale]);

    // Random rotation (0, 90, 180, 270)
    const rot = rng.randInt(0, 3) * Math.PI / 2;
    const [cx, cy] = polygonCentroid(verts);
    verts = rotateVerts(verts, rot, cx, cy);

    // Normalize to origin
    const minX = Math.min(...verts.map(v => v[0]));
    const minY = Math.min(...verts.map(v => v[1]));
    verts = verts.map(([x, y]) => [Math.round((x - minX) * 10) / 10, Math.round((y - minY) * 10) / 10]);

    const area = polygonArea(verts);
    // Score: area-based with randomness
    const score = Math.round(area * rng.randFloat(0.8, 2.5) / 10);

    shapes.push({
      id: i,
      name: t.name,
      baseVerts: verts,
      score: Math.max(5, score),
      color: colors[i % colors.length],
      area: Math.round(area),
    });
  }

  return { seed, boxW, boxH, shapes };
}

// ===== Game state =====
let currentProblemIdx = 0;
let problems = [];
let placed = [];       // { shapeId, x, y, worldVerts }
let selectedShapeId = null;
let ghostPos = null;
let hoveredPlaced = -1;
let dragging = null;   // { placedIdx, offsetX, offsetY }


const NUM_PROBLEMS = 20;
const N_SHAPES = 12;
const BOX_W = 120;
const BOX_H = 100;
const BASE_SEED = 42;
const CANVAS_PAD = 40;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function initProblems() {
  problems = [];
  for (let i = 0; i < NUM_PROBLEMS; i++) {
    problems.push(generateProblem(BASE_SEED + i, N_SHAPES, BOX_W, BOX_H));
  }
}

function loadProblem() {
  const p = problems[currentProblemIdx];
  placed = [];
  selectedShapeId = null;
  ghostPos = null;
  dragging = null;
  document.getElementById('problem-info').textContent = `Problem ${currentProblemIdx + 1} / ${NUM_PROBLEMS} (seed=${p.seed})`;
  buildShapeTray();
  resizeCanvas();
  draw();
  updateScore();
}

function prevProblem() { currentProblemIdx = (currentProblemIdx - 1 + NUM_PROBLEMS) % NUM_PROBLEMS; loadProblem(); }
function nextProblem() { currentProblemIdx = (currentProblemIdx + 1) % NUM_PROBLEMS; loadProblem(); }
function resetProblem() { loadProblem(); }
function removeLast() {
  if (placed.length > 0) { placed.pop(); buildShapeTray(); draw(); updateScore(); }
}

// ===== Shape table =====
let sortKey = 'ratio';
let sortDir = -1; // -1 = descending

function buildShapeTray() {
  const tbody = document.getElementById('shape-tbody');
  tbody.innerHTML = '';
  const p = problems[currentProblemIdx];
  const placedIds = new Set(placed.map(p => p.shapeId));

  // Sort shapes
  const sorted = [...p.shapes].sort((a, b) => {
    let va, vb;
    if (sortKey === 'name') { va = a.name; vb = b.name; return sortDir * va.localeCompare(vb); }
    if (sortKey === 'score') { va = a.score; vb = b.score; }
    else if (sortKey === 'area') { va = a.area; vb = b.area; }
    else { va = a.score / a.area; vb = b.score / b.area; }
    return sortDir * (va - vb);
  });

  // Update header styling
  document.querySelectorAll('#shape-table th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.sort === sortKey);
    const arrow = sortDir > 0 ? ' \u25B2' : ' \u25BC';
    const base = th.dataset.sort === 'name' ? 'Shape' : th.dataset.sort === 'score' ? 'Pts' : th.dataset.sort === 'area' ? 'Area' : 'Pts/A';
    th.textContent = th.dataset.sort === sortKey ? base + arrow : base;
  });

  for (const shape of sorted) {
    const tr = document.createElement('tr');
    tr.className = 'shape-row' + (placedIds.has(shape.id) ? ' placed' : '') + (selectedShapeId === shape.id ? ' selected' : '');

    // Mini canvas
    const tdShape = document.createElement('td');
    const mini = document.createElement('canvas');
    const mw = 40, mh = 30;
    mini.width = mw; mini.height = mh;
    const mctx = mini.getContext('2d');
    const vs = shape.baseVerts;
    const maxX = Math.max(...vs.map(v => v[0]));
    const maxY = Math.max(...vs.map(v => v[1]));
    const sc = Math.min((mw - 4) / maxX, (mh - 4) / maxY);
    const ox = (mw - maxX * sc) / 2, oy = (mh - maxY * sc) / 2;
    mctx.fillStyle = shape.color + '44';
    mctx.strokeStyle = shape.color;
    mctx.lineWidth = 1;
    mctx.beginPath();
    vs.forEach(([x, y], i) => {
      if (i === 0) mctx.moveTo(ox + x * sc, oy + y * sc);
      else mctx.lineTo(ox + x * sc, oy + y * sc);
    });
    mctx.closePath();
    mctx.fill();
    mctx.stroke();
    tdShape.appendChild(mini);
    tr.appendChild(tdShape);

    const tdPts = document.createElement('td');
    tdPts.className = 'col-pts';
    tdPts.textContent = shape.score;
    tr.appendChild(tdPts);

    const tdArea = document.createElement('td');
    tdArea.className = 'col-area';
    tdArea.textContent = shape.area;
    tr.appendChild(tdArea);

    const tdRatio = document.createElement('td');
    tdRatio.className = 'col-ratio';
    tdRatio.textContent = (shape.score / shape.area).toFixed(2);
    tr.appendChild(tdRatio);

    tr.addEventListener('click', () => {
      if (placedIds.has(shape.id)) return;
      selectedShapeId = shape.id;
      buildShapeTray();
      draw();
    });

    tbody.appendChild(tr);
  }
}

// Sort header clicks
document.querySelectorAll('#shape-table th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) { sortDir *= -1; }
    else { sortKey = key; sortDir = key === 'name' ? 1 : -1; }
    buildShapeTray();
  });
});

// ===== Canvas =====
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const maxW = wrap.clientWidth - 40;
  const maxH = wrap.clientHeight - 40;
  const scale = Math.min(maxW / (BOX_W + CANVAS_PAD * 2), maxH / (BOX_H + CANVAS_PAD * 2));
  canvas.width = (BOX_W + CANVAS_PAD * 2) * scale;
  canvas.height = (BOX_H + CANVAS_PAD * 2) * scale;
  canvas.dataset.scale = scale;
}

function toCanvas(x, y) {
  const s = parseFloat(canvas.dataset.scale) || 1;
  return [(x + CANVAS_PAD) * s, (y + CANVAS_PAD) * s];
}

function fromCanvas(cx, cy) {
  const s = parseFloat(canvas.dataset.scale) || 1;
  return [cx / s - CANVAS_PAD, cy / s - CANVAS_PAD];
}

function drawPoly(verts, fill, stroke, lineWidth = 2) {
  const s = parseFloat(canvas.dataset.scale) || 1;
  ctx.fillStyle = fill;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  verts.forEach(([x, y], i) => {
    const [cx, cy] = toCanvas(x, y);
    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
  });
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function draw() {
  const p = problems[currentProblemIdx];
  const s = parseFloat(canvas.dataset.scale) || 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw box
  const [bx, by] = toCanvas(0, 0);
  ctx.fillStyle = '#111122';
  ctx.strokeStyle = '#445';
  ctx.lineWidth = 2;
  ctx.fillRect(bx, by, BOX_W * s, BOX_H * s);
  ctx.strokeRect(bx, by, BOX_W * s, BOX_H * s);

  // Grid lines
  ctx.strokeStyle = '#222233';
  ctx.lineWidth = 0.5;
  for (let x = 50; x < BOX_W; x += 50) {
    const [cx] = toCanvas(x, 0);
    ctx.beginPath(); ctx.moveTo(cx, by); ctx.lineTo(cx, by + BOX_H * s); ctx.stroke();
  }
  for (let y = 50; y < BOX_H; y += 50) {
    const [, cy] = toCanvas(0, y);
    ctx.beginPath(); ctx.moveTo(bx, cy); ctx.lineTo(bx + BOX_W * s, cy); ctx.stroke();
  }

  // Draw placed shapes
  placed.forEach((pl, idx) => {
    const shape = p.shapes[pl.shapeId];
    const isDragging = dragging !== null && dragging.placedIdx === idx;
    const fill = shape.color + (isDragging ? '88' : '66');
    const stroke = shape.color;
    drawPoly(pl.worldVerts, fill, stroke, isDragging ? 3 : 2);

    // Label
    const [cx, cy] = polygonCentroid(pl.worldVerts);
    const [sx, sy] = toCanvas(cx, cy);
    ctx.fillStyle = '#fff';
    ctx.font = `${11 * s}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shape.score + 'pts', sx, sy);
  });

  // Draw ghost
  if (selectedShapeId !== null && ghostPos) {
    const shape = p.shapes[selectedShapeId];
    const verts = getTransformedVerts(shape.baseVerts, ghostPos[0], ghostPos[1]);
    const valid = isPlacementValid(verts, -1);
    const ghostFill = valid ? shape.color + '33' : '#ff000022';
    const ghostStroke = valid ? shape.color + '88' : '#ff000088';
    drawPoly(verts, ghostFill, ghostStroke, 1);
  }

  // Box label
  const [lx, ly] = toCanvas(BOX_W / 2, -8);
  ctx.fillStyle = '#667';
  ctx.font = `${12 * s}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${BOX_W} x ${BOX_H}`, lx, ly);
}

function getTransformedVerts(baseVerts, px, py) {
  const [cx, cy] = polygonCentroid(baseVerts);
  return translateVerts(baseVerts, px - cx, py - cy);
}

function checkOverlap(placedIdx) {
  const a = placed[placedIdx].worldVerts;
  for (let i = 0; i < placed.length; i++) {
    if (i === placedIdx) continue;
    if (polygonsOverlap(a, placed[i].worldVerts)) return true;
  }
  return false;
}

// Check if verts can be placed without collision. skipIdx = index to ignore (for dragging).
function isPlacementValid(verts, skipIdx) {
  if (!polyInBox(verts, BOX_W, BOX_H)) return false;
  for (let i = 0; i < placed.length; i++) {
    if (i === skipIdx) continue;
    if (polygonsOverlap(verts, placed[i].worldVerts)) return false;
  }
  return true;
}

function updateScore() {
  let total = 0;
  const p = problems[currentProblemIdx];
  placed.forEach((pl) => {
    total += p.shapes[pl.shapeId].score;
  });
  document.getElementById('score-val').textContent = total;
}

// ===== Input =====
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const [x, y] = fromCanvas(e.clientX - rect.left, e.clientY - rect.top);
  ghostPos = [x, y];

  if (dragging !== null) {
    // Move dragged shape
    const p = problems[currentProblemIdx];
    const pl = placed[dragging.placedIdx];
    const shape = p.shapes[pl.shapeId];
    const nx = x - dragging.offsetX;
    const ny = y - dragging.offsetY;
    const newVerts = getTransformedVerts(shape.baseVerts, nx, ny);
    if (isPlacementValid(newVerts, dragging.placedIdx)) {
      pl.x = nx;
      pl.y = ny;
      pl.worldVerts = newVerts;
    }
    draw();
    updateScore();
    return;
  }

  // Check if hovering a placed shape
  hoveredPlaced = -1;
  for (let i = placed.length - 1; i >= 0; i--) {
    if (pointInPolygon(x, y, placed[i].worldVerts)) { hoveredPlaced = i; break; }
  }

  canvas.style.cursor = selectedShapeId !== null ? 'crosshair' : (hoveredPlaced >= 0 ? 'grab' : 'default');
  draw();
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return; // left click only
  const rect = canvas.getBoundingClientRect();
  const [x, y] = fromCanvas(e.clientX - rect.left, e.clientY - rect.top);
  const p = problems[currentProblemIdx];

  if (selectedShapeId !== null) {
    // Place new shape
    const shape = p.shapes[selectedShapeId];
    const worldVerts = getTransformedVerts(shape.baseVerts, x, y);
    if (isPlacementValid(worldVerts, -1)) {
      placed.push({ shapeId: selectedShapeId, x, y, worldVerts });
      selectedShapeId = null;
      buildShapeTray();
      draw();
      updateScore();
    }
    return;
  }

  // Start dragging a placed shape — recompute hover in case mousemove didn't fire
  let clickedIdx = -1;
  for (let i = placed.length - 1; i >= 0; i--) {
    if (pointInPolygon(x, y, placed[i].worldVerts)) { clickedIdx = i; break; }
  }
  if (clickedIdx >= 0) {
    const pl = placed[clickedIdx];
    dragging = { placedIdx: clickedIdx, offsetX: x - pl.x, offsetY: y - pl.y };
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (dragging !== null) {
    dragging = null;
    canvas.style.cursor = hoveredPlaced >= 0 ? 'grab' : 'default';
    draw();
    updateScore();
  }
});

canvas.addEventListener('mouseleave', () => {
  if (dragging !== null) {
    dragging = null;
    draw();
    updateScore();
  }
  ghostPos = null;
  draw();
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const [x, y] = fromCanvas(e.clientX - rect.left, e.clientY - rect.top);
  // Right click: remove shape under cursor
  for (let i = placed.length - 1; i >= 0; i--) {
    if (pointInPolygon(x, y, placed[i].worldVerts)) {
      placed.splice(i, 1);
      hoveredPlaced = -1;
      dragging = null;
      buildShapeTray();
      draw();
      updateScore();
      return;
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    selectedShapeId = null;
    draw();
  }
});

window.addEventListener('resize', () => { resizeCanvas(); draw(); });

// ===== Init =====
initProblems();
loadProblem();
</script>
